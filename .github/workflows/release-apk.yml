name: Build signed release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build signed APK
    # Only the repo owner's pushes/dispatches build; skipped on forks and for other contributors.
    if: github.repository == 'Ivorisnoob/OpenStream' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        shell: bash
        env:
          MOVIFY_KEYSTORE_BASE64: ${{ secrets.MOVIFY_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$MOVIFY_KEYSTORE_BASE64" ]]; then
            echo "Missing required GitHub Actions secret: MOVIFY_KEYSTORE_BASE64" >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/movify-release.jks"
          printf '%s' "$MOVIFY_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

      - name: Build signed universal release APK
        shell: bash
        env:
          MOVIFY_KEYSTORE_PATH: ${{ runner.temp }}/movify-release.jks
          MOVIFY_KEYSTORE_PASSWORD: ${{ secrets.MOVIFY_KEYSTORE_PASSWORD }}
          MOVIFY_KEY_ALIAS: ${{ secrets.MOVIFY_KEY_ALIAS }}
          MOVIFY_KEY_PASSWORD: ${{ secrets.MOVIFY_KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          for variable in \
            MOVIFY_KEYSTORE_PASSWORD \
            MOVIFY_KEY_ALIAS \
            MOVIFY_KEY_PASSWORD
          do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required GitHub Actions secret: $variable" >&2
              exit 1
            fi
          done

          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/movify-artifact"
          cp app/build/outputs/apk/release/app-universal-release.apk \
            "$RUNNER_TEMP/movify-artifact/Movify-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Movify-release-${{ github.sha }}
          path: ${{ runner.temp }}/movify-artifact/Movify-release.apk
          if-no-files-found: error
          retention-days: 14
